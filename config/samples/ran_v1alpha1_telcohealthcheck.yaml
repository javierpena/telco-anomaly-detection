apiVersion: ran.openshift.io/v1alpha1
kind: TelcoHealthcheck
metadata:
  name: telco-healthcheck
spec:
  # Monitor all ACM ManagedClusters except the hub itself.
  # Use `include` instead to whitelist specific clusters (mutually exclusive with exclude).
  managedClusters:
    exclude:
      - local-cluster

  # Restrict monitoring to these namespaces on each spoke cluster.
  managedNamespaces:
    - openshift-sriov-network-operator
    - openshift-ovn-kubernetes

  # Enable Thanos alert rules and agentic runs for each category.
  alerts:
    hostNetwork: true
    podNetwork: true
    ovsProcessCPU: false
    hostReservedCPU: true
    # Enable user-defined alerts
    userAlerts: false

  # Optional external Alertmanager for action-required run alerts.
  # alertManager:
  #   url: https://alertmanager.example.com
  #   authType: bearer  # none (default), bearer, or basic
  #   credentialsSecret:
  #     name: alertmanager-credentials  # Secret in telco-healthcheck-system

  periodicHealthChecks:
    # Check each spoke every 6 hours when a periodic check is enabled.
    period: 6h
    # Each spoke starts independently after a delay in this window (defaults: 30s–5m).
    # minJitter: 30s
    # maxJitter: 5m
    # Set both to 0s to create runs synchronously.
    rdsCompliance:
      enabled: false
      # period: 24h  # uncomment to override the default period for RDS checks
      # maxJitter: 10m  # override only the global maximum for this check
    lowLatencyCheck:
      enabled: false
      # period: 12h  # optional low-latency-specific interval
      # minJitter: 1m  # optional override of the global minimum
      # maxJitter: 10m  # optional override of the global maximum

  # Keep hub-side run records for 7 days; omit to retain them indefinitely.
  # purgeInterval: 168h
