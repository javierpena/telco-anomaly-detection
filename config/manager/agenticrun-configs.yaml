apiVersion: v1
kind: ConfigMap
metadata:
  name: telco-anomaly-rds-compliance-config
  namespace: telco-healthcheck-system
  labels:
    app.kubernetes.io/managed-by: telco-anomaly-detection
data:
  request: |
    You are an experienced OpenShift administrator. With the available tools at your disposal, check if the OpenShift cluster ${CLUSTER_NAME} is compliant with the Telco RAN DU reference design specification.
  skills:  '[{"image":"quay.io/javierpena/telco-anomaly-skills:latest","paths":["/skills/check-rds-compliance"]}]'
  mcpServers: '[{"name":"kube-compare-mcp","timeoutSeconds":300,"url":"${KUBE_COMPARE_MCP_URL}"}]'
