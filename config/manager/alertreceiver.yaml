apiVersion: apps/v1
kind: Deployment
metadata:
  name: telco-anomaly-alert-receiver
  namespace: telco-healthcheck-system
  labels:
    app: telco-anomaly-alert-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telco-anomaly-alert-receiver
  template:
    metadata:
      labels:
        app: telco-anomaly-alert-receiver
    spec:
      serviceAccountName: telco-anomaly-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertreceiver
          image: quay.io/javierpena/telco-anomaly-alert-receiver:latest
          imagePullPolicy: Always
          args:
            - --bind-address=:8080
          ports:
            - name: webhook
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhook
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: telco-anomaly-alert-receiver
  namespace: telco-healthcheck-system
  labels:
    app: telco-anomaly-alert-receiver
spec:
  selector:
    app: telco-anomaly-alert-receiver
  ports:
    - name: webhook
      port: 8080
      targetPort: 8080
      protocol: TCP
