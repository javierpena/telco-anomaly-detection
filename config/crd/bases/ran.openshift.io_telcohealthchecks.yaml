---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: telcohealthchecks.ran.openshift.io
spec:
  group: ran.openshift.io
  names:
    kind: TelcoHealthcheck
    listKind: TelcoHealthcheckList
    plural: telcohealthchecks
    shortNames:
    - thc
    singular: telcohealthcheck
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.monitoredClusters
      name: Clusters
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TelcoHealthcheck monitors telco workload health across ACM managed
          clusters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TelcoHealthcheckSpec defines the desired state of TelcoHealthcheck.
            properties:
              alerts:
                description: Alerts controls which alert categories create Thanos
                  rules and trigger agentic runs.
                properties:
                  hostNetwork:
                    description: HostNetwork enables monitoring of host-network related
                      alerts.
                    type: boolean
                  hostReservedCPU:
                    description: HostReservedCPU enables monitoring of host reserved-CPU
                      related alerts.
                    type: boolean
                  ovsProcessCPU:
                    description: OVSProcessCPU enables monitoring of OVS process CPU
                      usage alerts.
                    type: boolean
                  podNetwork:
                    description: PodNetwork enables monitoring of pod-network related
                      alerts.
                    type: boolean
                required:
                - hostNetwork
                - hostReservedCPU
                - ovsProcessCPU
                - podNetwork
                type: object
              logLevel:
                default: info
                description: |-
                  LogLevel controls logging verbosity for both the controller and alert receiver.
                  Set to "debug" to enable V(1) messages. Changes take effect on the next
                  reconcile without restarting pods. Defaults to "info".
                enum:
                - info
                - debug
                type: string
              managedClusters:
                description: ManagedClusters selects which ACM ManagedCluster resources
                  are monitored.
                properties:
                  exclude:
                    description: Exclude lists ManagedCluster names to skip. All others
                      are monitored.
                    items:
                      type: string
                    type: array
                  include:
                    description: Include lists ManagedCluster names to monitor. All
                      others are ignored.
                    items:
                      type: string
                    type: array
                type: object
                x-kubernetes-validations:
                - message: include and exclude are mutually exclusive
                  rule: '!(has(self.include) && self.include.size() > 0 && has(self.exclude)
                    && self.exclude.size() > 0)'
              managedNamespaces:
                description: |-
                  ManagedNamespaces lists the namespaces to monitor on each managed cluster.
                  An empty list means no namespace monitoring is active.
                items:
                  type: string
                type: array
              periodicHealthChecks:
                description: PeriodicHealthChecks defines the schedule for periodic
                  agentic health checks.
                properties:
                  period:
                    description: Period is the default interval between periodic health
                      checks across all clusters.
                    type: string
                  rdsCompliance:
                    description: RDSCompliance configures the RDS compliance check
                      schedule and enablement.
                    properties:
                      enabled:
                        description: Enabled activates RDS compliance checks when
                          true.
                        type: boolean
                      period:
                        description: Period overrides the default check interval for
                          RDS compliance checks.
                        type: string
                    required:
                    - enabled
                    type: object
                required:
                - period
                type: object
            required:
            - alerts
            - managedClusters
            - managedNamespaces
            - periodicHealthChecks
            type: object
          status:
            description: TelcoHealthcheckStatus defines the observed state of TelcoHealthcheck.
            properties:
              conditions:
                description: Conditions reports the current reconciliation state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastPeriodicRunTime:
                description: LastPeriodicRunTime records when the last periodic health
                  check was triggered.
                format: date-time
                type: string
              lastRDSComplianceRunTime:
                description: LastRDSComplianceRunTime records when the last RDS compliance
                  check was triggered.
                format: date-time
                type: string
              monitoredClusters:
                description: MonitoredClusters is the resolved list of cluster names
                  currently being monitored.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
