apiVersion: v1
kind: ConfigMap
metadata:
  name: telco-anomaly-host-network-config
  labels:
    app.kubernetes.io/managed-by: telco-anomaly-detection
    ran.openshift.io/system-managed-alert: "true"
data:
  alertName: TelcoHealthCheckHostNetwork
  alertGroupName: telco-host-network
  alertRule: |
    - alert: TelcoHealthCheckHostNetwork
      expr: sum by (clusterID, cluster, instance, prometheus) (instance:node_network_receive_drop_excluding_lo:rate1m > 1) or sum by (clusterID, cluster, instance, prometheus) (instance:node_network_transmit_drop_excluding_lo:rate1m > 1)
      for: 1m
      labels:
        severity: warning
      annotations:
        cluster: '{{ $labels.cluster }}'
        node: '{{ $labels.instance }}'
  alertMetrics: "[]"
  request: |
    You are an experienced OpenShift administrator. Alert TelcoHealthCheckHostNetwork has been raised for this cluster.
    Check the network configuration of the node identified by the instance field in the alert, analyze the potential causes for this alert, and propose remediation steps.
  skills: "[]"
  mcpServers: "[]"
