apiVersion: apps/v1
kind: Deployment
metadata:
  name: telco-anomaly-kube-compare-mcp
  namespace: telco-healthcheck-system
  labels:
    app: telco-anomaly-kube-compare-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telco-anomaly-kube-compare-mcp
  template:
    metadata:
      labels:
        app: telco-anomaly-kube-compare-mcp
    spec:
      serviceAccountName: kube-compare-mcp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-compare-mcp
          image: quay.io/javierpena/kube-compare-mcp:f5be8da
          imagePullPolicy: Always
          args:
            - --port=8080
            - --transport=http
            - --log-level=debug
          env:
            # Mount registry credentials for accessing private container registries
            # The secret should contain a .dockerconfigjson with credentials for registry.redhat.io
            - name: DOCKER_CONFIG
              value: /etc/docker-credentials
            # Optional: Configure container image extraction limits
            # Uncomment and adjust if you need larger file sizes or longer timeouts
            # - name: KUBE_COMPARE_MCP_MAX_FILE_SIZE
            #   value: "104857600"  # Max file size in bytes (default: 100MB)
            # - name: KUBE_COMPARE_MCP_IMAGE_PULL_TIMEOUT
            #   value: "5m"  # Image pull timeout (default: 5 minutes)
          volumeMounts:
            - name: registry-credentials
              mountPath: /etc/docker-credentials
              readOnly: true
          ports:
            - name: mcp-port
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: mcp-port
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: mcp-port
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      terminationGracePeriodSeconds: 10
      volumes:
        - name: registry-credentials
          secret:
            # Optional: Create this secret for RDS tools that access registry.redhat.io
            secretName: kube-compare-registry-credentials
            optional: true  # Allows deployment without the secret; RDS tools will fail until configured
            items:
              - key: .dockerconfigjson
                path: config.json
---
apiVersion: v1
kind: Service
metadata:
  name: telco-anomaly-kube-compare-mcp
  namespace: telco-healthcheck-system
  labels:
    app: telco-anomaly-kube-compare-mcp
spec:
  selector:
    app: telco-anomaly-kube-compare-mcp
  ports:
    - name: mcp-port
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: telco-anomaly-kube-compare-mcp
  namespace: telco-healthcheck-system
  labels:
    app: telco-anomaly-kube-compare-mcp
spec:
  port:
    targetPort: mcp-port
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
  to:
    kind: Service
    name: telco-anomaly-kube-compare-mcp
    weight: 100
  wildcardPolicy: None
