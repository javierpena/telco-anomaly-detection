apiVersion: v1
kind: ConfigMap
metadata:
  name: telco-anomaly-low-latency-check-config
  labels:
    app.kubernetes.io/managed-by: telco-anomaly-detection
    ran.openshift.io/system-managed-periodic: "true"
data:
  checkName: low-latency-check
  request: |-
    You are an experienced OpenShift administrator. With the available tools at your disposal, assess OpenShift nodes in cluster ${CLUSTER_NAME} for low-latency readiness
  skills: '[{"image":"quay.io/javierpena/telco-anomaly-skills:latest","paths":["/skills/check-low-latency-configuration"]}]'
  mcpServers: '[]'
